services:
  - type: web
    name: dnd-template-creator
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: REDIS_HOST
        sync: false
      - key: REDIS_PORT
        sync: false
      - key: REDIS_PASSWORD
        sync: false
      - key: REDIS_DB
        value: 0
      - key: SECRET_KEY
        generateValue: true
      - key: ADMIN_CODE
        sync: false
      - key: RENDER
        value: true